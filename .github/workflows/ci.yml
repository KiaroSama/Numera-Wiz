name: Rust CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  formatting:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install formatter
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt
      - name: Enforce source formatting
        run: cargo fmt --all -- --check
      - name: Prepare exact formatter changes
        if: always()
        shell: bash
        run: |
          cargo fmt --all
          git diff --binary -- crates apps xtask > formatting.patch
      - name: Save formatter evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-formatting
          path: formatting.patch
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install the selected toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Compile and run ordinary regressions
        run: cargo test --locked --workspace --all-targets
      - name: Lint implementation
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build the desktop composition
        run: cargo build --locked -p numera-wiz --features desktop
      - name: Check shared browser UI dependency closure
        if: runner.os == 'Linux'
        run: cargo check --locked -p nw-ui --target wasm32-unknown-unknown
      - name: Verify preserved research hashes
        run: cargo run --locked -p xtask -- verify-research
      - name: Generate current contracts
        run: cargo run --locked -p xtask -- schemas
      - name: Save development executables
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: numera-wiz-development-${{ matrix.os }}
          path: |
            target/debug/numera-wiz
            target/debug/numera-wiz.exe
          if-no-files-found: error
      - name: Prepare formatting evidence
        if: always()
        shell: bash
        run: |
          cargo fmt --all
          git diff --binary -- crates apps xtask > formatting.patch
      - name: Save dependency and generated evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: development-evidence-${{ matrix.os }}
          path: |
            Cargo.lock
            formatting.patch
            docs/generated/
          if-no-files-found: error

  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: FFmpeg/FFmpeg
          ref: 946fcce07b6dcd0331c8cc609192aeff5e1924f8
          path: target/fixture-ffmpeg-src
      - name: Install toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Build the identified CPU fixture component profile
        run: cargo run --locked -p xtask -- build-fixture-profile
      - name: Execute actual media preservation regressions
        env:
          NW_FIXTURE_COMPONENTS: ${{ github.workspace }}/target/fixture-components/bin
        run: cargo test --locked -p nw-engine --test media -- --ignored --nocapture
      - name: Save fixture components and actual configuration
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ffmpeg-development-fixture-profile-linux
          path: |
            target/fixture-components/
            target/fixture-ffmpeg-src/ffbuild/config.log
            target/fixture-ffmpeg-src/config.h
          if-no-files-found: warn
