name: Rust CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install selected resolver
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Resolve workspace edges without upgrading unrelated packages
        run: cargo update --workspace
      - name: Save the exact resolved closure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resolved-dependencies
          path: Cargo.lock
      - name: Enforce the committed lockfile
        run: git diff --exit-code -- Cargo.lock
  formatting:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install formatter
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt
      - name: Enforce source formatting
        run: cargo fmt --all -- --check
      - name: Prepare exact formatter changes
        if: always()
        shell: bash
        run: |
          cargo fmt --all
          git diff --binary -- crates apps xtask test-support > formatting.patch
      - name: Save formatter evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-formatting
          path: formatting.patch
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Restore WASM compilation cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/wasm32-unknown-unknown
          key: web-1.99.1-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('crates/**/*.rs', 'xtask/**/*.rs') }}
          restore-keys: web-1.99.1-${{ hashFiles('Cargo.lock') }}-
      - name: Install native automation and WASM toolchains
        run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
      - name: Build same-source shared browser application
        run: cargo run --locked -p xtask -- build-web
      - name: Save immutable web namespace and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: embedded-web
          path: target/web-ui/
          if-no-files-found: error
  browser:
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NW_EMBED_WEB_DIR: ${{ github.workspace }}/target/web-ui
      NW_CHROMEDRIVER: /usr/local/share/chromedriver-linux64/chromedriver
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: embedded-web
          path: target/web-ui
      - name: Install selected Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Record actual browser and driver candidates
        run: |
          google-chrome --version
          "$NW_CHROMEDRIVER" --version
      - name: Exercise embedded namespace, pairing and session boundaries
        run: cargo test --locked -p numera-wiz --features embedded-web --bin numera-wiz server::browser::tests::embedded_namespace
      - name: Boot real shared UI in the runner's Chrome
        run: cargo test --locked -p numera-wiz --features embedded-web --bin numera-wiz server::browser::tests::packaged_browser -- --ignored --nocapture
      - name: Retain actual browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-boot-evidence-linux-chrome
          path: target/browser-evidence/
          if-no-files-found: warn
  checks:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Restore verified-toolchain compilation cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
            target/wasm32-unknown-unknown
          key: checks-1.99.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('crates/**/*.rs', 'apps/**/*.rs', 'xtask/**/*.rs', 'test-support/**/*.rs') }}
          restore-keys: |
            checks-1.99.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-
      - name: Install the selected toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Check platform boundaries before the application build
        run: cargo test --locked -p nw-platform --all-targets
      - name: Compile and run ordinary regressions
        run: cargo test --locked --workspace --exclude nw-platform --all-targets
      - name: Lint implementation
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Load matching immutable UI namespace
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: embedded-web
          path: target/web-ui
      - name: Build the desktop composition with its matching browser assets
        env:
          NW_EMBED_WEB_DIR: ${{ github.workspace }}/target/web-ui
        run: cargo build --locked -p numera-wiz --features desktop,embedded-web
      - name: Check shared browser UI dependency closure
        if: runner.os == 'Linux'
        run: cargo check --locked -p nw-ui --target wasm32-unknown-unknown
      - name: Verify preserved research hashes
        run: cargo run --locked -p xtask -- verify-research
      - name: Generate current contracts
        run: cargo run --locked -p xtask -- schemas
      - name: Save development executables
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: numera-wiz-development-${{ matrix.os }}
          path: |
            target/debug/numera-wiz
            target/debug/numera-wiz.exe
          if-no-files-found: error
      - name: Prepare formatting evidence
        if: always()
        shell: bash
        run: |
          cargo fmt --all
          git diff --binary -- crates apps xtask test-support > formatting.patch
      - name: Save dependency and generated evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: development-evidence-${{ matrix.os }}
          path: |
            Cargo.lock
            formatting.patch
            docs/generated/
          if-no-files-found: error

  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: FFmpeg/FFmpeg
          ref: 946fcce07b6dcd0331c8cc609192aeff5e1924f8
          path: target/fixture-ffmpeg-src
      - name: Restore verified-toolchain compilation cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
            target/wasm32-unknown-unknown
          key: media-1.99.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('crates/**/*.rs', 'apps/**/*.rs', 'xtask/**/*.rs', 'test-support/**/*.rs') }}
          restore-keys: |
            media-1.99.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-
      - name: Install toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Build the identified CPU fixture component profile
        run: cargo run --locked -p xtask -- build-fixture-profile
      - name: Execute actual media preservation regressions
        env:
          NW_FIXTURE_COMPONENTS: ${{ github.workspace }}/target/fixture-components/bin
        run: cargo test --locked -p nw-engine --test media -- --ignored --nocapture
      - name: Exercise actual owner and official SDK transport media parity
        env:
          NW_FIXTURE_COMPONENTS: ${{ github.workspace }}/target/fixture-components/bin
        run: cargo test --locked -p numera-wiz --test owner_media -- --ignored --nocapture
      - name: Save fixture components and actual configuration
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ffmpeg-development-fixture-profile-linux
          path: |
            target/fixture-components/
            target/fixture-ffmpeg-src/ffbuild/config.log
            target/fixture-ffmpeg-src/config.h
          if-no-files-found: warn
