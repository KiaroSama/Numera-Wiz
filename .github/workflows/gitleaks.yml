name: Gitleaks

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 2'

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks secret scan
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_HOME: ${{ runner.temp }}/security-active-rustup-${{ github.run_id }}-${{ github.run_attempt }}
      CARGO_HOME: ${{ runner.temp }}/security-active-cargo-${{ github.run_id }}-${{ github.run_attempt }}
      CARGO_TARGET_DIR: ${{ runner.temp }}/security-active-target-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Disable Actions step debug logging before security bootstrap
        if: ${{ runner.debug == '1' }}
        shell: bash
        run: exit 1

      - name: Record the original security bootstrap budget
        shell: bash
        run: |
          /usr/bin/install --mode=0600 --no-target-directory -- /proc/uptime "${RUNNER_TEMP}/nw-security-bootstrap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.stamp"

      - name: Create private compiler and build directories
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          /usr/bin/install --directory --mode=0700 -- "${RUSTUP_HOME}" "${CARGO_HOME}" "${CARGO_TARGET_DIR}"

      - name: Install the pinned Rust toolchain
        working-directory: ${{ runner.temp }}
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Record compiler and Cargo release provenance
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          rustc +1.99.1 --version --verbose
          cargo +1.99.1 --version --verbose

      - name: Record the compiler executable SHA256
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          /usr/bin/sha256sum < "${RUSTUP_HOME}/toolchains/1.99.1-x86_64-unknown-linux-gnu/bin/rustc"

      - name: Check out the qualified immutable security tool source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: 32a8f429a78cdf81f76732db9f9c3737a17bed9d
          path: security-tool-source
          fetch-depth: 1
          persist-credentials: false

      - name: Record the qualified tool manifest SHA256
        working-directory: security-tool-source/xtask/security-scan
        shell: bash
        run: /usr/bin/sha256sum < Cargo.toml

      - name: Record the qualified tool lock SHA256
        working-directory: security-tool-source/xtask/security-scan
        shell: bash
        run: /usr/bin/sha256sum < Cargo.lock

      - name: Build the isolated security executable with its qualified lock
        working-directory: security-tool-source/xtask/security-scan
        shell: bash
        run: cargo +1.99.1 build --locked --manifest-path Cargo.toml --bin nw-security-scan

      - name: Record the built security executable SHA256
        working-directory: security-tool-source/xtask/security-scan
        shell: bash
        run: |
          /usr/bin/sha256sum < "${CARGO_TARGET_DIR}/debug/nw-security-scan"

      - name: Export the original immutable bootstrap deadline
        working-directory: security-tool-source/xtask/security-scan
        shell: bash
        run: '"${CARGO_TARGET_DIR}/debug/nw-security-scan" budget-from-marker'

      - name: Check out the complete Git history as separate scan input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: security-scan-input
          fetch-depth: 0
          persist-credentials: false

      - name: Scan full Git history with the qualified Rust security tool
        working-directory: security-tool-source/xtask/security-scan
        shell: bash
        run: '"${CARGO_TARGET_DIR}/debug/nw-security-scan" scan "${GITHUB_WORKSPACE}/security-scan-input"'
