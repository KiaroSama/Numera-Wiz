[workspace]
members = ["."]
resolver = "3"

[package]
name = "nw-schema-validator"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "GPL-3.0-or-later"
autobins = false
autoexamples = false
autotests = false
autobenches = false

[[bin]]
name = "nw-schema-validator"
path = "src/main.rs"
test = false
bench = false

[dependencies]
jsonschema = { version = "=0.61.2", default-features = false, features = ["arbitrary-precision"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
