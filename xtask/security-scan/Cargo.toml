[workspace]
members = ["."]
resolver = "3"

[package]
name = "nw-security-scan"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "GPL-3.0-or-later"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "nw_security_scan"
path = "src/lib.rs"
test = false
bench = false
doctest = false

[[bin]]
name = "nw-security-scan"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "nw-security-qualify"
path = "src/qualify.rs"
test = false
bench = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"

[target.'cfg(target_os = "linux")'.dependencies]
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
rustix = { version = "=1.1.6", default-features = false, features = ["std", "process", "fs", "time"] }
serde = { version = "=1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "=1.0.154", features = ["arbitrary_precision"] }
sha2 = "=0.11.1"
signal-hook = { version = "=0.4.6", default-features = false }
tar = { version = "=0.4.46", default-features = false }

[profile.dev]
debug = 0

[profile.dev.package."sha2:0.11.1"]
opt-level = 3
